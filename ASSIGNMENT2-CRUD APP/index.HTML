<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stories CRUD (jQuery + API)</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body>
  <div class="container mt-5">
    <h2 class="mb-4 text-center">Stories CRUD Application</h2>

    <form id="createForm">
      <div class="mb-3">
        <label for="createTitle" class="form-label">Title</label>
        <input
          type="text"
          class="form-control"
          id="createTitle"
          placeholder="Enter story title"
          required
        />
      </div>
      <div class="mb-3">
        <label for="createContent" class="form-label">Content</label>
        <textarea
          class="form-control"
          id="createContent"
          rows="3"
          placeholder="Enter story content"
          required
        ></textarea>
      </div>
      <button id="createBtn" type="submit" class="btn btn-primary">Create</button>
      <button id="clearBtn" type="button" class="btn btn-secondary" style="display: none;">Clear</button>
    </form>

    <hr class="my-4" />

    <div id="storiesList"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="jqcrud.js"></script>
</body>
</html>
